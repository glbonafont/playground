<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonafont</title>
<meta name="theme-color" content="#DEDED9">
<script>document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#DEDED9;
    --ink:#1A1A1A;
    --mute:color-mix(in srgb,var(--ink) 52%,var(--paper));
    --line:color-mix(in srgb,var(--ink) 38%,var(--paper));
    --dot:color-mix(in srgb,var(--ink) 28%,transparent);
    --display:"Oswald","Arial Narrow",sans-serif;
    --ui:"Quicksand","Nunito","Varela Round",sans-serif;
    --write:"Quicksand","Nunito","Varela Round",sans-serif;
    --grain-o:.07;--grain-b:multiply;
    --gloss:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%);
    --glass-bg:var(--gloss),linear-gradient(150deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 40%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.38) 100%);
    --glass-dark:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(150deg,#3b3b3b,#151515);
    --glass-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -3px 6px rgba(26,26,26,.16),inset 1.5px 0 2px rgba(255,255,255,.5),inset -1.5px 0 2px rgba(255,255,255,.3),0 8px 16px -8px rgba(26,26,26,.5);
    --pop-bg:linear-gradient(rgba(26,26,26,.08),rgba(26,26,26,.08)),rgba(255,255,255,.1);
    --pop-shadow:inset 0 4px 9px rgba(26,26,26,.4),inset 0 -1px 0 rgba(255,255,255,.7),0 1px 3px -1px rgba(26,26,26,.3);
    --dlg-tint:color-mix(in srgb,var(--paper) 52%,transparent);
    --dlg-glass:var(--gloss),linear-gradient(150deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.1) 45%,rgba(255,255,255,.3) 100%);
    --dlg-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -4px 10px rgba(26,26,26,.12),inset 2px 0 3px rgba(255,255,255,.5),inset -2px 0 3px rgba(255,255,255,.3),0 24px 48px -16px rgba(26,26,26,.5);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --paper:#151513;
    --ink:#E4E4DE;
    --mute:color-mix(in srgb,var(--ink) 64%,var(--paper));
    --grain-o:.1;--grain-b:screen;
    --gloss:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%);
    --glass-bg:var(--gloss),linear-gradient(150deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.09) 100%);
    --glass-dark:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%),linear-gradient(150deg,#ececE6,#b9b9b2);
    --glass-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.5),inset 1.5px 0 2px rgba(255,255,255,.1),inset -1.5px 0 2px rgba(255,255,255,.07),0 8px 16px -8px rgba(0,0,0,.85);
    --pop-bg:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),rgba(255,255,255,.04);
    --pop-shadow:inset 0 4px 9px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.18),0 1px 3px -1px rgba(0,0,0,.6);
    --dlg-tint:color-mix(in srgb,var(--paper) 55%,transparent);
    --dlg-glass:var(--gloss),linear-gradient(150deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 45%,rgba(255,255,255,.1) 100%);
    --dlg-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -4px 10px rgba(0,0,0,.5),inset 2px 0 3px rgba(255,255,255,.1),inset -2px 0 3px rgba(255,255,255,.07),0 24px 48px -16px rgba(0,0,0,.9);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    min-height:100dvh;
    background-color:var(--paper);
    background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);
    background-size:28px 28px;
    background-position:14px 14px;
    color:var(--ink);
    font-family:var(--ui);
    font-size:16px;
    line-height:1.5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:96px 24px 96px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain-o);mix-blend-mode:var(--grain-b);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8 .55' numOctaves='2' seed='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:2;background:var(--paper);
    border-bottom:1.5px solid var(--ink);
    padding:max(14px,env(safe-area-inset-top)) 0 12px;display:flex;justify-content:center;
  }
  .logo{
    font-family:var(--display);
    font-weight:500;font-size:1.2rem;letter-spacing:.12em;line-height:1;
    color:var(--ink);text-decoration:none;
  }
  .logo:focus-visible{outline:2px solid var(--ink);outline-offset:6px}

  main{width:min(560px,100%);display:flex;flex-direction:column;gap:40px;position:relative}

  .field{position:relative;padding-bottom:12px}
  .field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink)}
  .field:focus-within::after{height:3px}
  textarea{
    width:100%;display:block;border:0;outline:0;resize:none;background:transparent;color:inherit;
    font:400 clamp(26px,6vw,36px)/1.3 var(--write);
    text-align:center;min-height:2.6em;caret-color:var(--ink);
  }
  textarea::placeholder{color:var(--mute);opacity:1;font-size:.7em;line-height:1.3}
  .landmark{display:block;width:84px;margin:0 auto 16px;color:var(--ink)}
  .landmark[hidden]{display:none}
  .landmark svg{display:block;width:100%;height:auto}

  /* ===== cristal líquido (todos los botones) ===== */
  .glass{
    position:relative;cursor:pointer;color:var(--ink);font-family:var(--ui);
    border:1.25px solid color-mix(in srgb,var(--ink) 80%,transparent);
    background:var(--glass-bg);
    -webkit-backdrop-filter:blur(8px) saturate(1.3);backdrop-filter:blur(8px) saturate(1.3);
    box-shadow:var(--glass-shadow);
  }
  .glass:hover,.glass:focus-visible{background:var(--glass-dark);color:var(--paper)}
  .glass:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .glass:active{transform:scale(.94)}
  .glass:disabled{color:var(--mute);border-color:var(--line);cursor:default;background:var(--glass-bg);opacity:.6}

  /* ===== plataformas: circulares ===== */
  .send{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px;min-height:104px}
  .send button{width:64px;height:64px;padding:0;border-radius:50%;display:grid;place-items:center}
  .send button.is-best{width:96px;height:96px;border-width:2px}
  .send svg{width:46%;height:46%;fill:currentColor;display:block;pointer-events:none}
  .send button.glass[aria-disabled="true"]{color:var(--mute);border-color:var(--line);opacity:.6;cursor:default;background:var(--glass-bg)}
  .send button.flash{animation:refresh .42s steps(1,end) 1}
  @keyframes refresh{
    0%{background:var(--ink);color:var(--paper)}
    30%{background:var(--paper);color:var(--ink)}
    55%{background:var(--ink);color:var(--paper)}
    100%{background:var(--paper);color:var(--ink)}
  }

  /* ideas */
  .ideas{display:flex;flex-direction:column;gap:8px;min-height:9em}
  .ideas p{font-size:13px;color:var(--mute);margin-bottom:2px;font-weight:500}
  .ideas button{text-align:left;font:400 16px/1.35 var(--ui);padding:12px 16px;border-radius:14px}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--paper);
    border-top:1.5px solid var(--ink);
    padding:10px 20px max(10px,env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;min-height:52px;
  }
  footer span{color:var(--mute);font-weight:500}
  footer button{font:500 13px var(--ui);padding:7px 14px;border-radius:12px;white-space:nowrap}

  dialog{
    margin:auto;width:min(460px,calc(100% - 32px));padding:28px;
    border:1.5px solid color-mix(in srgb,var(--ink) 70%,transparent);border-radius:28px;
    background-color:var(--dlg-tint);background-image:var(--dlg-glass);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
    box-shadow:var(--dlg-shadow);color:var(--ink);font-family:var(--ui);
  }
  dialog::backdrop{
    background-color:color-mix(in srgb,var(--paper) 40%,transparent);
    background-image:conic-gradient(color-mix(in srgb,var(--ink) 30%,transparent) 25%,transparent 0 50%,color-mix(in srgb,var(--ink) 30%,transparent) 0 75%,transparent 0);
    background-size:4px 4px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  dialog h2{font:600 22px/1.2 var(--ui);margin-bottom:10px}
  dialog p{font-size:15px;margin-bottom:14px}
  dialog small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
  dialog ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:10px}
  dialog li{font-size:15px;padding-left:12px;border-left:2px solid var(--ink)}
  dialog li b{font-weight:600;display:block}
  .row{display:flex;gap:12px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .row button,.pick{font:500 15px var(--ui);padding:9px 18px;border-radius:12px;display:inline-block}
  .glass.pick:focus-visible{outline-offset:3px}
  input[type=file]{display:none}

  /* ===== modos de entrada ===== */
  .voice{display:none;flex-direction:column;align-items:center;gap:14px}
  body[data-mode="voice"] .voice,body[data-mode="conversation"] .voice{display:flex}
  body[data-mode="voice"] #msg,body[data-mode="conversation"] #msg{display:none}
  body[data-mode="voice"] .field::after,body[data-mode="conversation"] .field::after{display:none}
  .transcript{
    font:400 clamp(24px,5.5vw,32px)/1.3 var(--write);text-align:center;width:100%;
    min-height:2.6em;display:grid;place-items:center;
  }
  .transcript.empty{color:var(--mute);font-size:clamp(18px,4.2vw,24px)}
  .mic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;padding:0}
  .mic svg{width:40%;height:40%;fill:currentColor;grid-area:1/1;pointer-events:none}
  .ic-wave{display:none}
  body[data-mode="conversation"] .ic-wave{display:block}
  body[data-mode="conversation"] .ic-mic{display:none}
  .mic.live{background:var(--glass-dark);color:var(--paper)}
  .mic.live::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--ink);animation:listen 1.2s steps(2,end) infinite;pointer-events:none}
  @keyframes listen{0%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.07)}}
  .hint{font-size:13px;color:var(--mute);font-weight:500;min-height:1.4em;text-align:center}
  .links{display:flex;gap:18px;min-height:2em}
  .link{border:0;background:none;color:var(--ink);font:500 14px var(--ui);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer;padding:6px}
  .link[hidden]{display:none}
  .link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ideas button.numbered{display:flex;align-items:center;gap:12px}
  .ideas button.numbered:hover .num,.ideas button.numbered:focus-visible .num{border-color:var(--paper)}
  .num{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;font-weight:600;font-size:14px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .field.flash,html.flash{animation:eflash .42s steps(1,end) 1}
  @keyframes eflash{0%{filter:invert(1)}35%{filter:none}60%{filter:invert(1)}100%{filter:none}}

  /* ===== burbuja de plástico ===== */
  .glass.pop{animation:bubble .5s cubic-bezier(.2,.8,.3,1)}
  @keyframes bubble{
    0%{transform:scale(1)}
    16%{transform:scale(.84)}
    34%{transform:scale(1.14)}
    58%{transform:scale(.95)}
    100%{transform:scale(1)}
  }
  /* reventada: sin brillo, con hoyuelo hacia dentro */
  .glass.popped,.glass.popped:hover,.glass.popped:focus-visible{
    background:var(--pop-bg);
    color:var(--ink);
    box-shadow:var(--pop-shadow);
  }
  .glass.popped svg{transform:scale(.9)}
  .burst{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
  .burst::before{
    content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--ink);
    animation:ring .5s ease-out both;
  }
  @keyframes ring{from{transform:scale(.9);opacity:.85}to{transform:scale(1.5);opacity:0}}
  .burst i{
    position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50% 40% 60% 45%;
    background:rgba(255,255,255,.8);border:1px solid var(--ink);
    animation:shard .55s cubic-bezier(.1,.7,.3,1) both;
  }
  @keyframes shard{
    from{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1);opacity:1}
    to{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.3);opacity:0}
  }

  @media (prefers-reduced-motion:reduce){.send button.flash,.glass.pop,.field.flash,html.flash,.mic.live::after{animation:none}.glass:active{transform:none}}
</style>
</head>

<p id="modeLive" class="sr" aria-live="polite"></p>
<header><a class="logo" href="https://bonafont.dev" aria-label="Bonafont">BONAFONT</a></header>

<main>
  <div class="field">
    <div id="landmark" class="landmark" role="img" hidden></div>
    <textarea id="msg" rows="2" data-i18n-ph="placeholder" data-i18n-aria="msgLabel"></textarea>
    <div class="voice" id="voiceView">
      <p class="transcript empty" id="transcript" aria-live="polite"></p>
      <button class="mic" id="micBtn" type="button">
        <svg class="ic-mic" aria-hidden="true"><use href="#i-mic"/></svg>
        <svg class="ic-wave" aria-hidden="true"><use href="#i-wave"/></svg>
      </button>
      <p class="hint" id="voiceStatus"></p>
      <div class="links"><button class="link" id="toWrite" type="button" hidden></button><button class="link" id="clearBtn" type="button" hidden></button></div>
    </div>
  </div>

  <div class="send" id="send">
    <button data-p="whatsapp" aria-label="WhatsApp"><svg aria-hidden="true"><use href="#i-wa"/></svg></button>
    <button data-p="teams" aria-label="Microsoft Teams"><svg aria-hidden="true"><use href="#i-teams"/></svg></button>
    <button data-p="x" aria-label="X"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>

  <section class="ideas" id="ideas" aria-live="polite"></section>
</main>

<footer>
  <span id="ctx"></span>
  <button id="calBtn"></button>
</footer>

<!-- permisos -->
<dialog id="permDlg">
  <h2 data-i18n="permTitle"></h2>
  <p data-i18n="permIntro"></p>
  <ul id="permList"></ul>
  <small data-i18n="permNote"></small>
  <small id="permWarn" hidden></small>
  <div class="row">
    <button id="permSkip" type="button" data-i18n="permSkip"></button>
    <button id="permAllow" type="button" autofocus data-i18n="permAllow"></button>
  </div>
</dialog>

<!-- calendario -->
<dialog id="calDlg">
  <h2 data-i18n="calTitle"></h2>
  <p data-i18n="calText"></p>
  <label class="pick" tabindex="0" id="pickLbl"><span data-i18n="calPick"></span>
    <input type="file" id="ics" accept=".ics,text/calendar">
  </label>
  <small id="calMsg"></small>
  <div class="row">
    <button id="calClear" type="button" data-i18n="calRemove"></button>
    <button id="calClose" type="button" data-i18n="calClose"></button>
  </div>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);

  /* ================= IDIOMA ================= */
  const I18N = {
    es:{
      placeholder:'¿Qué se cuece hoy?', modeWrite:'Escribir', clear:'Borrar', micTalk:'Toca para dictar', micStop:'Toca para parar', tapConv:'Toca para hablar conmigo', listening:'Te escucho…', speaking:'Hablando…', noSpeech:'Tu navegador no permite voz. Usa el modo escrito.', ideasConv:'Di el número de la opción',
      modeNames:{write:'Modo escrito',voice:'Modo voz',conversation:'Modo conversación'},
      conv:{intro:o=>`Te propongo ${o.length} mensajes. ${o.map((t,i)=>`Opción ${i+1}: ${t}.`).join(' ')} Di un número o dicta tu mensaje.`, confirm:(m,p)=>`Tu mensaje: ${m}. ¿Lo envío por ${p}? Di sí, no, o el nombre de otra plataforma.`, noHear:'No te he oído.', again:'No te he entendido. Di sí, no o una plataforma.'}, msgLabel:'Mensaje', ideas:'Ideas para ahora', best:'Lo más adecuado para este mensaje',
      calConnect:'Conectar calendario', calendar:'Calendario', calTitle:'Tu calendario',
      calText:'Importa un archivo .ics exportado desde Google Calendar, Outlook o Calendario de Apple. Se lee en este dispositivo y no se envía a ningún servidor.',
      calPick:'Elegir archivo .ics', calRemove:'Quitar', calClose:'Cerrar',

    const h = Math.sin(dLat/2)**2 + Math.cos(r(a.latitude)) * Math.cos(r(b.latitude)) * Math.sin(dLon/2)**2;

  }
  function tierLight(y){               // luminancia media de la cámara 0..255
    if (lightTier === 'dark'){ if (y > 60) lightTier = y > 80 ? 'bright' : 'mid'; }
    else if (lightTier === 'bright'){ if (y < 65) lightTier = y < 45 ? 'dark' : 'mid'; }
    else if (y < 45) lightTier = 'dark'; else if (y > 80) lightTier = 'bright';
    return lightTier;
  }
  function toneNow(){                  // calmado solo con poca luz Y poco ruido; enérgico solo con luz Y ruido
    if (sens.light === null || sens.noise === null) return 'neutral';
    const e = (sens.light === 'dark' ? -1 : sens.light === 'bright' ? 1 : 0) + (sens.noise === 'quiet' ? -1 : sens.noise === 'loud' ? 1 : 0);
    return e <= -2 ? 'calm' : e >= 2 ? 'lively' : 'neutral';
  }
  function applyTheme(){
    let t = themeNow;
    if (sens.light === 'dark') t = 'dark';
    else if (sens.light === 'bright') t = 'light';
    else if (t === null) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === themeNow) return;
    const first = themeNow === null; themeNow = t;
    document.documentElement.dataset.theme = t;
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'dark' ? '#151513' : '#DEDED9';
    if (!first && !reduceMotion.matches){
      const root = document.documentElement;
      root.classList.remove('flash'); void root.offsetWidth; root.classList.add('flash');
      const h = e => { if (e.target === root){ root.classList.remove('flash'); root.removeEventListener('animationend', h); } };
      root.addEventListener('animationend', h);
    }
  }

  /* ================= MODOS DE ENTRADA: escribir · voz · conversación ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dbg = ['activity','noisy','headphones','light','noise'].some(k => qs.has(k));     // ?activity=walk|car|still&noisy=1&headphones=1
  const canSpeak = !!SR || dbg;
  const speechLocale = lang === 'ca' ? 'ca-ES' : lang === 'es' ? 'es-ES' : (/^en/i.test(navigator.language || '') ? navigator.language : 'en-US');
  const PN = {whatsapp:'WhatsApp', teams:'Teams', x:'X'};
  const transcript = $('#transcript'), micBtn = $('#micBtn'), vStatus = $('#voiceStatus');
  const toWrite = $('#toWrite'), clearBtn = $('#clearBtn'), live = $('#modeLive'), fieldEl = $('.field');
  toWrite.textContent = T.modeWrite; clearBtn.textContent = T.clear;

  let mode = 'write', manual = null, cand = null, candSince = 0, lastTyped = 0;
  let lastVehicleAt = 0, speedVehicle = false, carConn = false;
  let rec = null, listening = false, convActive = false, convPick = null, ideasList = [];

  function showTranscript(){
    const v = msg.value.trim();
    transcript.textContent = v || msg.placeholder;
    transcript.classList.toggle('empty', !v);
    clearBtn.hidden = !v || mode === 'write';
  }
  const setStatus = t => { vStatus.textContent = t || ''; };
  function updateMic(){
    const conv = mode === 'conversation', on = conv ? convActive : listening;
    micBtn.classList.toggle('live', on);
    micBtn.setAttribute('aria-label', on ? T.micStop : (conv ? T.tapConv : T.micTalk));
    if (mode !== 'write' && !on) setStatus(canSpeak ? (conv ? T.tapConv : T.micTalk) : T.noSpeech);
  }

  /* --- selección de modo según contexto --- */
  const ctxKey = () => [sens.headphones, sens.vehicle, sens.moving, sens.noisy].map(v => v ? 1 : 0).join('');
  function resolveMode(){
    if (!canSpeak) return 'write';
    if (sens.headphones || sens.vehicle) return 'conversation';
    if (sens.moving) return sens.noisy ? 'write' : 'voice';
    return 'write';
  }
  function setMode(m){
    if (m === mode) return;
    stopVoice(); mode = m;
    document.body.dataset.mode = m;
    toWrite.hidden = m === 'write';
    updateMic(); render();
    live.textContent = T.modeNames[m];
    if (!reduceMotion.matches){
      fieldEl.classList.remove('flash'); void fieldEl.offsetWidth; fieldEl.classList.add('flash');
      fieldEl.addEventListener('animationend', () => fieldEl.classList.remove('flash'), {once:true});
    }
  }
  function evaluateMode(){
    let target;
    if (manual && manual.key === ctxKey()) target = manual.mode;
    else { manual = null; target = resolveMode(); }
    if (target === mode){ cand = null; return; }
    if (cand !== target){ cand = target; candSince = Date.now(); }
    const typing = mode === 'write' && msg.value.trim() && Date.now() - lastTyped < 5000;
    if (Date.now() - candSince >= (dbg ? 0 : 6000) && !typing && !listening && !convActive){ cand = null; setMode(target); }
  }
  setInterval(evaluateMode, 1000);
  function goWrite(){ manual = {mode:'write', key:ctxKey()}; setMode('write'); msg.focus(); }
  toWrite.onclick = goWrite;
  clearBtn.onclick = () => { msg.value = ''; autosize(); sync(); };

  /* --- auriculares / coche por la ruta de audio (mejor esfuerzo: depende del navegador) --- */
  const HP = /head(phone|set)|earbud|earphone|airpods|\bbuds\b|auricular|casc|bluetooth/i;
  const CAR = /car ?play|android ?auto|\bcar\b|vehicle|coche|cotxe|uconnect|\bsync\b/i;
  async function checkRoute(){
    try{
      const ds = await navigator.mediaDevices.enumerateDevices();
      const labels = ds.filter(d => d.kind === 'audiooutput' || d.kind === 'audioinput').map(d => d.label).filter(Boolean);
      if (!labels.length) return;
      carConn = labels.some(l => CAR.test(l)); applyVehicle();
      setSens('headphones', !carConn && labels.some(l => HP.test(l) && !/earpiece|speakerphone|built-?in|internal/i.test(l)));
    }catch{}
  }
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', checkRoute);

  /* --- voz: dictado --- */
  function stopVoice(){
    convActive = false; convPick = null;
    try{ rec && rec.abort(); }catch{}
    rec = null; listening = false;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  function dictate(){
    if (listening){ try{ rec.stop(); }catch{} return; }
    const base = msg.value.trim() ? msg.value.trim() + ' ' : '';
    const r = new SR(); r.lang = speechLocale; r.continuous = true; r.interimResults = true;
    let fin = '';
    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += t; else interim += t;
      }
      msg.value = (base + fin + interim).trim(); autosize(); sync();
    };
    r.onerror = e => { if (/not-allowed|service-not-allowed/.test(e.error)) setStatus(T.noSpeech); };
    r.onend = () => { listening = false; rec = null; updateMic(); };
    try{ r.start(); rec = r; listening = true; setStatus(T.listening); updateMic(); }catch{}
  }

  /* --- voz: conversación --- */
  const norm = x => x.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const words = x => norm(x).match(/\p{L}+|\d+/gu) || [];
  const NUM = {'1':1,uno:1,una:1,un:1,primera:1,primero:1,one:1,first:1,'2':2,dos:2,dues:2,segunda:2,segundo:2,segona:2,two:2,second:2,'3':3,tres:3,tercera:3,tercero:3,three:3,third:3};
  const FILLER = new Set(['la','el','lo','opcion','opcio','option','numero','number','the','quiero','vull','i','want','por','favor','per','please','porfavor']);
  function pickNumber(h){
    const w = words(h); if (!w.length || w.length > 5) return null;
    let n = null;
    for (const x of w){ if (NUM[x]) n = n || NUM[x]; else if (!FILLER.has(x)) return null; }
    return n;
  }
  const PLAT = [[/^(whatsapp|guasap|wasap|watsap|whats)$/,'whatsapp'],[/^(teams|tims|equipos)$/,'teams'],[/^(x|equis|ics|twitter)$/,'x']];
  const YES = new Set(['si','vale','ok','okay','acord','claro','envia','envialo','enviar','adelante','endavant','yes','yeah','sure','send']);
  const NO = new Set(['no','cancela','cancel','nope','para','atura','stop','borra','esborra']);
  const WRITE = new Set(['escribir','escribirlo','escriure','write','editar','editarlo','edit','teclado','teclat','type']);
  function platformIn(h){
    const w = words(h); if (w.length > 6) return null;
    for (const x of w) for (const [re, p] of PLAT) if (re.test(x)) return p;
    return null;
  }
  function intent(h){
    const w = words(h); if (w.length > 6) return null;
    if (w.some(x => WRITE.has(x))) return 'write';
    if (w.some(x => NO.has(x))) return 'no';
    if (w.some(x => YES.has(x))) return 'yes';
    return null;
  }
  const say = text => new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = speechLocale;
    const tn = toneNow(); u.rate = tn === 'calm' ? .85 : tn === 'lively' ? 1.12 : 1; u.pitch = tn === 'calm' ? .9 : tn === 'lively' ? 1.1 : 1;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
  const listenOnce = (ms = 9000) => new Promise(res => {
    if (!SR) return res(null);
    const r = new SR(); r.lang = speechLocale; r.continuous = false; r.interimResults = false;
    let got = null; const to = setTimeout(() => { try{ r.stop(); }catch{} }, ms);
    r.onresult = e => { got = e.results[0][0].transcript; };
    r.onerror = () => {};
    r.onend = () => { clearTimeout(to); if (rec === r) rec = null; res(got); };
    rec = r; try{ r.start(); }catch{ clearTimeout(to); res(null); }
  });
  function sendVia(p){
    const t = msg.value.trim(); if (!t) return;
    const url = links[p](t);
    // sin toque del usuario el navegador bloquea pestañas nuevas: si falla, se navega en la misma
    if (!window.open(url, '_blank', 'noopener')) location.assign(url);
  }
  async function convLoop(){
    let state = msg.value.trim() ? 'confirm' : 'choose', misses = 0, needIntro = true;
    while (convActive){
      if (state === 'choose'){
        if (needIntro){ setStatus(T.speaking); await say(`${msg.placeholder} ${T.conv.intro(ideasList.slice())}`); needIntro = false; }
        if (!convActive) break;
        const opts = ideasList.slice();
        let heard = null;
        if (!convPick){ setStatus(T.listening); heard = await listenOnce(); }
        if (!convActive) break;
        if (convPick){ convPick = null; autosize(); sync(); state = 'confirm'; continue; }
        if (!heard){ if (++misses >= 2) break; await say(T.conv.noHear); continue; }
        misses = 0;
        if (intent(heard) === 'write'){ goWrite(); break; }
        const n = pickNumber(heard);
        if (n){
          if (!opts[n-1]){ await say(T.conv.again); continue; }
          msg.value = opts[n-1];
        } else msg.value = heard.trim().charAt(0).toUpperCase() + heard.trim().slice(1);
        autosize(); sync(); state = 'confirm';
      } else {
        const best = pickPlatform(msg.value) || 'whatsapp';
        setStatus(T.speaking);
        await say(T.conv.confirm(msg.value.trim(), PN[best]));
        if (!convActive) break;
        if (convPick){ convPick = null; continue; }
        setStatus(T.listening);
        const heard = await listenOnce();
        if (!convActive) break;
        if (convPick){ convPick = null; continue; }
        if (!heard){ if (++misses >= 2) break; continue; }
        misses = 0;
        const p = platformIn(heard), it = intent(heard);
        if (p){ sendVia(p); break; }
        if (it === 'yes'){ sendVia(best); break; }
        if (it === 'write'){ goWrite(); break; }
        if (it === 'no'){ msg.value = ''; autosize(); sync(); state = 'choose'; needIntro = true; continue; }
        await say(T.conv.again);
      }
    }
  }
  micBtn.addEventListener('click', () => {
    if (!SR){ setStatus(T.noSpeech); return; }
    if (mode === 'voice') dictate();
    else if (mode === 'conversation'){
      if (convActive){ stopVoice(); updateMic(); return; }
      convActive = true; updateMic();
      convLoop().finally(() => { convActive = false; updateMic(); });
    }
  });

  if (dbg){
    const a = qs.get('activity');
    if (a){ sens.moving = a !== 'still'; sens.vehicle = a === 'car'; }
    if (qs.has('noisy')) sens.noisy = qs.get('noisy') === '1';
    if (qs.has('headphones')) sens.headphones = qs.get('headphones') === '1';
    if (qs.has('noisy')) sens.noise = sens.noisy ? 'loud' : 'mid';
    if (qs.has('noise')){ sens.noise = qs.get('noise'); sens.noisy = sens.noise === 'loud'; }   // quiet|mid|loud
    if (qs.has('light')) sens.light = qs.get('light');                                           // dark|mid|bright
  }

  /* ================= ARRANQUE ================= */
  render(); autosize();
  evaluateMode(); updateMic();
  setInterval(render, 60000);

  const allowBtn = $('#permAllow'), skipBtn = $('#permSkip');
  skipBtn.onclick = () => permDlg.close();
  allowBtn.onclick = async () => {
    allowBtn.disabled = skipBtn.disabled = true;
    await enableContext();
    allowBtn.disabled = skipBtn.disabled = false;
    permDlg.close();
  };

  (async () => {
    if (!window.isSecureContext){
      const w = $('#permWarn'); w.textContent = T.permInsecure; w.hidden = false; allowBtn.disabled = true;
      permDlg.showModal(); return;
    }
    if (await alreadyGranted()){ enableContext(); return; }
    permDlg.showModal();
  })();
})();
</script>
</body>
</html>
